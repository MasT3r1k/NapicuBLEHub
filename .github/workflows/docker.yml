name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once
      - name: Build image
        run: |
          docker build -t ghcr.io/numax-cz/napicublehub:latest \
                       -t numaxcz/napicublehub:latest .

      # Push both
      - name: Push image
        run: |
          docker push ghcr.io/numax-cz/napicublehub:latest
          docker push numaxcz/napicublehub:latest